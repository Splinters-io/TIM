server {
    listen 8443 ssl;
    listen 80;
    server_name server;

    ssl_certificate     /certs/server.pem;
    ssl_certificate_key /certs/server-key.pem;
    # Offer old protocol versions too, like a real legacy device server.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

    location / {
        default_type text/plain;
        return 200 "ACCOUNT DATA: owner=you balance=42 last_login=2023-12-30\n";
    }
}
